name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve LF line endings on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Run the Rust tests
        env:
          RUST_MIN_STACK: 67108864
        run: cargo test
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Build the API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --offline
