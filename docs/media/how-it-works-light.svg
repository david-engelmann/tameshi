<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="How tameshi enforces the evidence floor and issues unsigned rulings">
  <title>How tameshi assembles evidence packs and gates check lifecycle rulings</title>
  <rect width="960" height="270" rx="18" fill="#faf9f6" stroke="#d6d3cd" stroke-width="1.5"/>
  <text x="26" y="36" fill="#6d28d9" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.1">TAMESHI PIPELINE  /  FLOOR-GATED CHECK LIFECYCLE</text>
  <text x="26" y="62" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="750">Assemble multi-tool check evidence, enforce the 30-defect + 14-day floor, and emit unsigned PRs</text>

  <rect x="24" y="84" width="212" height="162" rx="12" fill="#ffffff" stroke="#d6d3cd" stroke-width="1.3"/>
  <text x="38" y="108" fill="#6d28d9" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="11" font-weight="700">1. ASSEMBLE PACKS</text>
  <text x="38" y="132" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Four local sources</text>
  <text x="38" y="154" fill="#57534e" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <tspan x="38" dy="0">Joins catchledger pack or</tspan>
    <tspan x="38" dy="17">ledger, canaryfield</tspan>
    <tspan x="38" dy="17">scores, blindgate traces,</tspan>
    <tspan x="38" dy="17">and tameshi-decision/1</tspan>
  </text>

  <rect x="257" y="84" width="212" height="162" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="271" y="108" fill="#b45309" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="11" font-weight="700">2. EVIDENCE FLOOR</text>
  <text x="271" y="132" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">30 defects + 14 days</text>
  <text x="271" y="154" fill="#44403c" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <tspan x="271" dy="0">Packs below either leg</tspan>
    <tspan x="271" dy="17">are marked below_floor</tspan>
    <tspan x="271" dy="17">and refused by rule</tspan>
    <tspan x="271" dy="17">with exact shortfalls</tspan>
  </text>

  <rect x="490" y="84" width="212" height="162" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="504" y="108" fill="#6d28d9" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="11" font-weight="700">3. UNSIGNED RULING</text>
  <text x="504" y="132" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Keep, demote, quarantine</text>
  <text x="504" y="154" fill="#44403c" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <tspan x="504" dy="0">Emits tameshi-ruling/1</tspan>
    <tspan x="504" dy="17">JSON and PR body (kill</tspan>
    <tspan x="504" dy="17">allowed only when model</tspan>
    <tspan x="504" dy="17">decision recommends kill)</tspan>
  </text>

  <rect x="723" y="84" width="213" height="162" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="737" y="108" fill="#15803d" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="11" font-weight="700">4. HUMAN SIGN &amp; AUDIT</text>
  <text x="737" y="132" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">validate-ruling gate</text>
  <text x="737" y="154" fill="#44403c" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    <tspan x="737" dy="0">Human signs outside the</tspan>
    <tspan x="737" dy="17">tool while CI verifies</tspan>
    <tspan x="737" dy="17">every figure matches the</tspan>
    <tspan x="737" dy="17">underlying evidence pack</tspan>
  </text>
</svg>
