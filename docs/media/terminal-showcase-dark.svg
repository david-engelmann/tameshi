<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="tameshi terminal run over synthetic examples">
  <title>tameshi terminal showcase assembling evidence packs and generating unsigned rulings</title>
  <rect width="920" height="420" rx="16" fill="#141413" stroke="#33312d" stroke-width="1.5"/>
  <rect width="920" height="38" rx="16" fill="#1f1e1b"/>
  <rect y="22" width="920" height="16" fill="#1f1e1b"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#22c55e"/>
  <text x="460" y="23" text-anchor="middle" fill="#a8a29e" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600">tameshi assemble &amp;&amp; tameshi rule --pack out/packs/002-unit-checks.json ...</text>

  <g font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12.5">
    <text x="24" y="66" fill="#a78bfa">$</text>
    <text x="40" y="66" fill="#f5f2eb">tameshi assemble --catchledger examples/synthetic-catchledger-ledger.json \</text>
    <text x="54" y="85" fill="#f5f2eb">--canaryfield examples/synthetic-canaryfield-results.json \</text>
    <text x="54" y="104" fill="#f5f2eb">--blindgate examples/synthetic-blindgate-evidence.json --packs-dir out/packs</text>

    <text x="24" y="132" fill="#a78bfa">$</text>
    <text x="40" y="132" fill="#f5f2eb">tameshi rule --pack out/packs/001-style-checks.json --ruling quarantine --expires 2027-03-01 --out out/rulings</text>
    <text x="24" y="153" fill="#fca5a5">refused below floor  (style checks holds 0 canaryfield defects vs 30 required)</text>

    <text x="24" y="182" fill="#a78bfa">$</text>
    <text x="40" y="182" fill="#f5f2eb">tameshi rule --pack out/packs/002-unit-checks.json --ruling quarantine \</text>
    <text x="54" y="201" fill="#f5f2eb">--expires 2027-03-01 --today 2027-01-30 --out out/rulings &amp;&amp; head -n 14 out/rulings/ruling-unit-checks.md</text>

    <text x="24" y="232" fill="#c4b5fd" font-weight="700"># Ruling for unit checks</text>
    <text x="24" y="254" fill="#fde68a">This ruling is unsigned. A human signs it outside the tool before the pull request is submitted.</text>

    <text x="24" y="282" fill="#93c5fd" font-weight="700">Evidence                   Value</text>
    <text x="24" y="303" fill="#e7e5e4">Repository                 synthetic-repo</text>
    <text x="24" y="322" fill="#e7e5e4">Check / Ruling / Expiry    unit checks  |  quarantine (quarantined)  |  2027-03-01</text>
    <text x="24" y="341" fill="#e7e5e4">Catchledger scorecard      40 fires, 6 blocks, 3 catches, 1 false block, USD 0.04 / catch</text>
    <text x="24" y="360" fill="#86efac">Floor legs satisfied       30 / 30 canaryfield defects  |  14 / 14 catchledger CI days</text>
    <text x="24" y="388" fill="#a78bfa" font-weight="700">Validated via tameshi validate-ruling --pack ... --ruling ruling-unit-checks.json --body ruling-unit-checks.md</text>
  </g>
</svg>
