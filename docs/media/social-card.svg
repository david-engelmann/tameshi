<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="tameshi social preview card">
  <title>tameshi evidence pack and floor-gated lifecycle ruling tool for checks</title>
  <rect width="1280" height="640" fill="#141413"/>
  <rect x="36" y="36" width="1208" height="568" rx="28" fill="#1b1a17" stroke="#35322d" stroke-width="2"/>
  <rect x="84" y="88" width="176" height="36" rx="18" fill="#231c2e" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="108" cy="106" r="5" fill="#a78bfa"/>
  <text x="124" y="111" fill="#c4b5fd" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1">GATE TRUTH ARC</text>

  <text x="84" y="210" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-1.8">tameshi</text>
  <text x="84" y="274" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="31" font-weight="700">The evidence pack and lifecycle ruling tool for CI checks.</text>
  <text x="84" y="334" fill="#d6d3d1" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="84" dy="0">Assemble catchledger, canaryfield, and blindgate evidence,</tspan>
    <tspan x="84" dy="36">enforce the 30-defect and 14-day floor, and emit unsigned</tspan>
    <tspan x="84" dy="36">keep, demote, quarantine, or kill pull-request rulings.</tspan>
  </text>

  <g font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="16" fill="#a8a29e">
    <rect x="84" y="476" width="280" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="224" y="509" text-anchor="middle" fill="#f5f2eb">30 defects + 14 CI days</text>
    <rect x="384" y="476" width="270" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="519" y="509" text-anchor="middle" fill="#f5f2eb">Human-signed rulings</text>
    <rect x="674" y="476" width="310" height="54" rx="12" fill="#24221f" stroke="#3f3c37"/>
    <text x="829" y="509" text-anchor="middle" fill="#f5f2eb">Deletes nothing on disk</text>
  </g>
</svg>
